name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[data,dev]'
      - name: Test
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          test_status=${PIPESTATUS[0]}

          # Keep a useful failure summary on the check run. Public Actions logs
          # require an authenticated session, while check annotations remain
          # visible to contributors who are diagnosing a failed pull request.
          if (( test_status != 0 )); then
            PYTEST_LOG="$RUNNER_TEMP/pytest.log" python - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["PYTEST_LOG"]).read_text(errors="replace")[-12_000:]
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failed::{escaped}")
          PY
          fi

          exit "$test_status"
