[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "influence-field"
version = "0.1.0"
description = "Research code for intervention-aware differentiable influence fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
data = [
  "pandas>=2.0",
  "Pillow>=9.5",
  "scikit-learn>=1.3",
  "torchvision>=0.15",
  "tqdm>=4.65",
]
benchmarks = [
  "av>=12.0",
  "causal-learn>=0.1.3.8",
  "google-genai>=1.0",
  "httpx>=0.27",
  "huggingface-hub>=0.24",
  "matplotlib>=3.7",
  "opencv-python>=4.8",
  "peft>=0.12",
  "pydot>=2.0",
  "transformers>=4.45",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
py-modules = [
  "benchmark_datasets",
  "causal_metrics",
  "frozen_backbones",
  "metacausal_field",
  "train_metacausal_field",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["experiments*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
